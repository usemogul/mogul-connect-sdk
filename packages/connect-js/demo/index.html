<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mogul Connect — demo harness</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0 auto;
        max-width: 720px;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
      }
      form {
        display: grid;
        gap: 12px;
        margin-bottom: 24px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      input,
      textarea {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #888;
        cursor: pointer;
      }
      #container {
        border: 1px dashed #bbb;
        border-radius: 8px;
        min-height: 80px;
        padding: 4px;
      }
      pre#log {
        background: #111;
        color: #d0f0d0;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
        max-height: 240px;
        font-size: 0.8rem;
      }

      /* Mobile: collapse everything except the iframe, which fills the viewport
         minus a small padding so the frame's edge is clearly visible. Mount the
         flow at desktop width (to set the token/params), then narrow to test. */
      @media (max-width: 640px) {
        h1,
        p,
        #config,
        h2,
        #log {
          display: none;
        }
        body {
          margin: 0;
          max-width: none;
          padding: 0;
        }
        #container {
          position: fixed;
          inset: 0;
          margin: 0;
          padding: 8px;
          border: none;
          border-radius: 0;
          min-height: 0;
          background: #e5e7eb;
          box-sizing: border-box;
        }
        /* !important overrides the inline height the resize handler sets, so the
           iframe fills the viewport instead of tracking the frame's content. */
        #container iframe {
          width: 100%;
          height: 100% !important;
          display: block;
          border: 0;
          border-radius: 4px;
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <h1>Mogul Connect — demo harness</h1>
    <p>
      Local harness for the Mogul Connect loader. Paste a session token (with
      the
      <code>connect_source</code> entitlement and an <code>accountId</code>),
      pick a target, and mount. Your serving origin must be allowlisted by Mogul
      for the embed host you point at.
    </p>

    <form id="config">
      <label>
        Embed origin
        <input id="origin" value="https://embed.usemogul.com" />
      </label>
      <label>
        Target (optional)
        <input
          id="target"
          placeholder="e.g. DISTROKID — blank opens the picker"
        />
      </label>
      <label>
        Session token (paste)
        <textarea id="token" rows="3" placeholder="eyJ..."></textarea>
      </label>
      <div class="actions">
        <button type="submit">Mount</button>
        <button type="button" id="destroy" disabled>Destroy</button>
      </div>
    </form>

    <div id="container"></div>

    <h2>Events</h2>
    <pre id="log"></pre>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
